name: Renovate
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Read-only lookup and proposed changes (no branches or PRs)
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: renovate
  cancel-in-progress: true
jobs:
  renovate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Require GitHub App configuration
        env:
          APP_CLIENT_ID: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo '::error::Configure RENOVATE_APP_CLIENT_ID and RENOVATE_APP_PRIVATE_KEY as repository Actions secrets. See docs/renovate.md.'
            exit 1
          fi
      - name: Create repository-scoped App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: read
          permission-checks: read
          permission-statuses: read
          permission-workflows: write
      - name: Configure the App bot commit identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "users/$bot" --jq .id)
          echo "RENOVATE_USERNAME=$bot" >> "$GITHUB_ENV"
          echo "RENOVATE_GIT_AUTHOR=$bot <$bot_id+$bot@users.noreply.github.com>" >> "$GITHUB_ENV"
      - name: Enable read-only manual run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"
      - name: Run self-hosted Renovate
        uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.171.8
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
